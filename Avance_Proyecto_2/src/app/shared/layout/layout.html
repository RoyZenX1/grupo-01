<a class="saltar" href="#contenido">Saltar al contenido</a>

<div class="layout" [class.sidebar-collapsed]="sidebarCollapsed()">

    <aside class="sidebar">
        <button class="menu-toggle" type="button" (click)="toggleSidebar()"
                aria-controls="menu-principal"
                [attr.aria-expanded]="!sidebarCollapsed()"
                [attr.aria-label]="sidebarCollapsed() ? 'Expandir menú' : 'Contraer menú'">
            <span></span><span></span><span></span>
        </button>

        <div class="logo">
            <h2>NexoCargo</h2>
            <p>Gestión logística</p>
        </div>

        <nav id="menu-principal" class="menu" aria-label="Navegación principal">
            @for (item of auth.menu(); track item.modulo) {
                <a [routerLink]="item.ruta"
                   routerLinkActive="activo"
                   ariaCurrentWhenActive="page"
                   [attr.data-icono]="item.icono"
                   [attr.title]="item.etiqueta">{{ item.etiqueta }}</a>
            }
        </nav>
    </aside>

    <div class="area">
        <header class="barra-superior">
            <nav class="migas" aria-label="Ubicación actual">
                <span>NexoCargo</span>
                <span aria-hidden="true">/</span>
                <strong>{{ paginaActual() }}</strong>
            </nav>

            <div class="usuario">
                <span class="avatar" aria-hidden="true">{{ inicial() }}</span>
                <div class="usuario-datos">
                    <span class="usuario-nombre">{{ auth.sesion()?.nombre }}</span>
                    <span class="insignia"
                          [class.insignia-admin]="auth.esAdmin()"
                          [class.insignia-cliente]="!auth.esAdmin()">{{ auth.sesion()?.rol }}</span>
                </div>
                <button type="button" class="btn-restaurar" (click)="cerrarSesion()">
                    Cerrar sesión
                </button>
            </div>
        </header>

        <main id="contenido" class="contenido" tabindex="-1">
            <router-outlet />
        </main>

        <footer class="pie">
            NexoCargo | Sistema de gestión logística | Avance 2 | {{ anio }}
        </footer>
    </div>

</div>
